<hlm-card class="h-full p-0">
  @if (link(); as target) {
    <a
      [routerLink]="target"
      [queryParams]="linkParams()"
      class="block h-full rounded-[var(--radius-card)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"
    >
      <div hlmCardContent class="flex h-full flex-col justify-between gap-2">
        <div class="flex items-start justify-between gap-2">
          <p class="text-xs text-muted-foreground">{{ label() }}</p>
          @if (spark(); as s) {
            <!-- A sparkline from the REAL daily series, when the API has one. -->
            <svg
              [attr.width]="s.w"
              [attr.height]="s.h"
              [attr.viewBox]="'0 0 ' + s.w + ' ' + s.h"
              class="h-6 w-24 shrink-0 overflow-visible"
              aria-hidden="true"
              preserveAspectRatio="none"
            >
              <polygon [attr.points]="s.area" class="fill-chart-1/10" />
              <polyline
                [attr.points]="s.points"
                fill="none"
                class="stroke-chart-1"
                stroke-width="1.5"
                vector-effect="non-scaling-stroke"
              />
            </svg>
          }
        </div>

        <p class="text-3xl font-medium tabular-nums tracking-tight"><bdi>{{ value() }}</bdi></p>

        @if (deltaText(); as text) {
          <div class="flex items-center gap-1.5">
            <span
              class="inline-flex items-center gap-1 rounded-full bg-muted px-1.5 py-0.5 text-xs font-medium"
              [class]="deltaTone()"
              [attr.aria-label]="comparisonLabel() + ': ' + text"
            >
              @if (arrow() === 'up') {
                <ng-icon name="lucideTrendingUp" class="size-3" aria-hidden="true" />
              } @else if (arrow() === 'down') {
                <ng-icon name="lucideTrendingDown" class="size-3" aria-hidden="true" />
              }
              <bdi>{{ text }}</bdi>
            </span>
          </div>
        } @else {
          <div class="h-[20px]"></div>
        }
      </div>
    </a>
  } @else {
    <div hlmCardContent class="flex h-full flex-col justify-between gap-2">
      <p class="text-xs text-muted-foreground">{{ label() }}</p>
      <p class="text-3xl font-medium tabular-nums tracking-tight"><bdi>{{ value() }}</bdi></p>
      <div class="h-[20px]"></div>
    </div>
  }
</hlm-card>
