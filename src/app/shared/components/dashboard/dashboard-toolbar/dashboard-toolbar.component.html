<div
  class="sticky top-0 z-20 -mx-2 flex flex-wrap items-center gap-x-4 gap-y-2 border-b bg-background/95 px-2 py-1.5 backdrop-blur"
>
  <!-- The range: the SAME tab group the cards use (a radiogroup here,
       because the range is one option out of a set, not a view). -->
  <app-tabs
    role="radio"
    [label]="'dashboard.rangeLabel' | transloco"
    [items]="tabItems()"
    [active]="activeTabId()"
    (activeChange)="selectDays($event)"
  />

  <!-- The range in effect, and the range it is compared against. -->
  <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted-foreground">
    <span class="flex items-center gap-1.5">
      <ng-icon name="lucideCalendar" class="size-3.5 shrink-0" aria-hidden="true" />
      <span dir="ltr" class="inline-flex items-center gap-1">
        <app-localized-date [value]="current().start" />
        <span>-</span>
        <app-localized-date [value]="lastDayOf(current())" />
      </span>
    </span>
    <span class="flex items-center gap-1.5">
      <ng-icon name="lucideRepeat" class="size-3.5 shrink-0" aria-hidden="true" />
      <span>{{ 'dashboard.vs' | transloco }}</span>
      <span dir="ltr" class="inline-flex items-center gap-1">
        <app-localized-date [value]="previous().start" />
        <span>-</span>
        <app-localized-date [value]="lastDayOf(previous())" />
      </span>
    </span>
  </div>

  <!-- The export: what it contains, and for which range. -->
  <button
    hlmBtn
    type="button"
    variant="outline"
    size="sm"
    class="ms-auto"
    [title]="exportTooltip()"
    [attr.aria-label]="exportTooltip()"
    (click)="exportCsv()"
  >
    <ng-icon name="lucideDownload" class="size-4" aria-hidden="true" />
    {{ 'dashboard.exportReport' | transloco }}
  </button>

  <!-- The selection is announced, not just drawn. -->
  <span class="sr-only" role="status" aria-live="polite">{{ announcement() }}</span>
</div>
