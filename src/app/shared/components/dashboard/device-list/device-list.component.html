<!--
  The list is ONE column: five device rows, each with its name, its bar and
  its count.

  It used to be two columns, which made the card short — and left the card
  next to it (Low stock) with a lot of empty space, because the two cards
  of a row share one height. One column gives the list a height that is
  close to the card next to it, so both cards fill their own area
  (design.md: no card is more than 1.5x the content it holds).
-->
<ul class="mt-2 flex flex-col gap-1.5 pb-1">
  @for (d of devices(); track d.deviceType) {
    <li class="flex items-center gap-2.5">
      <span
        class="flex size-6 shrink-0 items-center justify-center rounded-[0.35rem] bg-muted text-muted-foreground"
        aria-hidden="true"
        [attr.aria-label]="label(d.deviceType)"
      >
        <ng-icon [name]="icon(d.deviceType)" class="size-3.5" />
      </span>
      <span class="w-20 shrink-0 truncate text-sm" [title]="label(d.deviceType)">{{ label(d.deviceType) }}</span>
      <!-- The bar uses percent of TOTAL sessions. -->
      <span class="h-2 flex-1 rounded-full bg-muted overflow-hidden">
        <span
          class="block h-full rounded-full bg-chart-1"
          [style.width.%]="width(d.count)"
        ></span>
      </span>
      <!-- The count AND its unit, in the reader's language and in the right
           plural form. The unit follows the number in both languages. -->
      <span
        class="w-24 shrink-0 whitespace-nowrap text-end text-sm tabular-nums text-muted-foreground"
        [title]="d.count + ' ' + label(d.deviceType)"
      >
        {{ d.count | plural: 'dashboard.countSessions' }} ({{ percent(d.count) }}%)
      </span>
    </li>
  } @empty {
    <li class="py-4 text-center text-sm text-muted-foreground">{{ 'common.noData' | transloco }}</li>
  }
</ul>
