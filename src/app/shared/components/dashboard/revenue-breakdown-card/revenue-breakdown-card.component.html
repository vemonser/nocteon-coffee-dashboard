<app-widget-header [title]="'dashboard.revenueBy' | transloco" />

<!-- The tabs: one card, three ways of asking the same question. A tab with
     a single value is hidden (it would be a stat, not a chart). -->
@if (visibleTabs().length > 1) {
  <div
    role="tablist"
    [attr.aria-label]="'dashboard.revenueBy' | transloco"
    class="mt-1 flex items-center gap-1 border-b"
  >
    @for (t of visibleTabs(); track t.id) {
      <button
        hlmBtn
        role="tab"
        type="button"
        variant="ghost"
        size="sm"
        class="border-b-2 rounded-none px-2 py-0.5 text-sm transition-colors"
        [class.border-primary]="tab() === t.id"
        [class.text-foreground]="tab() === t.id"
        [class.border-transparent]="tab() !== t.id"
        [class.text-muted-foreground]="tab() !== t.id"
        [attr.aria-selected]="tab() === t.id"
        (click)="tab.set(t.id)"
      >
        {{ t.labelKey | transloco }}
      </button>
    }
  </div>
}

<div class="mt-3">
  <app-chart-card
    [slices]="slices()"
    [formatValue]="formatValue"
    [centerLabel]="centerLabel()"
    [ariaLabel]="ariaLabel()"
  />
</div>
