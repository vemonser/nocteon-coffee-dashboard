<hlm-card class="h-full">
  <!-- The header is the SAME header every other card uses, so the title and
       the range scope sit in the same place on the page. -->
  <hlm-card-header>
    <app-widget-header [title]="title()" [infoTitle]="measureNote()" />
  </hlm-card-header>
  <div hlmCardContent class="grow shrink-0">
    <!-- The tabs: one card, three ways of asking the same question. The
         SAME tab group the range in the toolbar uses. -->
    <app-tabs
      role="tab"
      [label]="title()"
      [items]="tabItems()"
      [active]="tab()"
      (activeChange)="tab.set($any($event))"
    />

    <div class="mt-4">
      <app-chart-card
        [slices]="slices()"
        [formatValue]="formatValue"
        [formatCompactValue]="formatCompactValue"
        [centerLabel]="centerLabel()"
        [ariaLabel]="ariaLabel()"
      />
    </div>
  </div>
</hlm-card>
