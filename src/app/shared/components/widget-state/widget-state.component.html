@switch (state()) {
  @case ('loading') {
    <!-- A skeleton with the shape of the content, so the page does not jump
         when the data lands. It respects reduced motion. -->
    <div class="flex flex-col gap-2" aria-hidden="true">
      @for (row of [].constructor(skeletonRows()); track $index) {
        <div class="flex items-center gap-3">
          <div class="size-8 shrink-0 rounded-full bg-muted skeleton"></div>
          <div class="flex-1 space-y-1.5">
            <div class="h-3 w-1/3 rounded bg-muted skeleton"></div>
            <div class="h-3 w-1/4 rounded bg-muted skeleton"></div>
          </div>
        </div>
      }
    </div>
    <span class="sr-only" role="status" aria-live="polite">{{ 'common.loading' | transloco }}</span>
  }
  @case ('error') {
    <div
      role="alert"
      class="flex flex-col items-start gap-2 rounded-lg border border-destructive/40 bg-destructive-soft p-3 text-sm text-destructive"
    >
      <p class="flex items-center gap-2 font-medium">
        <ng-icon name="lucideAlertTriangle" class="size-4 shrink-0" aria-hidden="true" />
        {{ 'common.errorTitle' | transloco }}
      </p>
      <p class="text-destructive/90">{{ error() }}</p>
      <button hlmBtn variant="outline" size="sm" (click)="retry()()">
        <ng-icon name="lucideRefreshCw" class="size-3.5" aria-hidden="true" />
        {{ 'common.retry' | transloco }}
      </button>
    </div>
  }
  @case ('empty') {
    <div class="flex items-center gap-2 py-1 text-sm text-muted-foreground">
      <span>{{ emptyLabel() || ('common.noData' | transloco) }}</span>
    </div>
  }
}
