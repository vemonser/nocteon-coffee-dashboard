<div
  class="fixed inset-0 bg-black/50 flex items-center justify-center">
  <div
    class="bg-white p-6 rounded-md w-96">
    <h2 class="font-bold">
      {{ 'common.delete' | transloco }}
    </h2>

    <p>
      {{ 'common.deleteConfirm' | transloco }}
      {{ entity()?.slug }}
      ?
    </p>

    <div
      class="flex gap-3 mt-4">
      <button
        (click)="cancel.emit()">
        {{ 'common.cancel' | transloco }}
      </button>

      <button
        (click)="confirm.emit()">
        {{ 'common.delete' | transloco }}
      </button>
    </div>
  </div>
</div>
