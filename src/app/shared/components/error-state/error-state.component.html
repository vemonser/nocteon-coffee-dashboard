<div role="alert" class="card-surface flex flex-col items-center gap-2 px-4 py-10 text-center">
  <span
    class="mb-1 flex size-10 items-center justify-center rounded-full bg-destructive-soft text-destructive"
    aria-hidden="true"
  >
    <ng-icon name="lucideAlertTriangle" class="size-5" />
  </span>

  <p class="font-medium text-destructive">{{ titleKey() | transloco }}</p>

  @if (hintKey()) {
    <p class="max-w-[46ch] text-sm text-muted-foreground">{{ hintKey() | transloco }}</p>
  }

  @if (message()) {
    <p class="max-w-[46ch] break-words text-xs text-muted-foreground">{{ message() }}</p>
  }

  <button hlmBtn variant="outline" size="sm" class="mt-2" (click)="retry.emit()">
    <ng-icon name="lucideRefreshCw" class="size-3.5" aria-hidden="true" />
    {{ retryKey() | transloco }}
  </button>
</div>
