<div
  role="tablist"
  [attr.aria-label]="tablistLabel()"
  class="inline-flex items-center gap-1 rounded-lg border bg-muted p-1"
>
  <button
    #trigger
    role="tab"
    type="button"
    [id]="'lifecycle-tab-active'"
    [attr.aria-selected]="selected() === 'active'"
    [attr.aria-controls]="'lifecycle-panel'"
    [tabIndex]="selected() === 'active' ? 0 : -1"
    class="inline-flex h-8 items-center gap-2 rounded-md px-3 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
    [class.bg-background]="selected() === 'active'"
    [class.text-foreground]="selected() === 'active'"
    [class.shadow-sm]="selected() === 'active'"
    [class.text-muted-foreground]="selected() !== 'active'"
    (click)="select('active')"
    (keydown)="onKeydown($event, 0)"
  >
    {{ activeLabel() }}
    <div
      class="rounded-full bg-muted px-1.5 text-[11px] flex aspect-square items-center justify-center font-semibold tabular-nums"
      [class.bg-primary]="selected() === 'active'"
      [class.text-primary-foreground]="selected() === 'active'"
    >
    <span class="leading-1">
      {{ activeCount() ?? '\u2014' }}
    </span>
    
</div>
    @if (activeCountLabel()) {
      <div class="">
        <span class="sr-only">{{ activeCountLabel() }}</span>
      </div>
    }
  </button>

  <button
    #trigger
    role="tab"
    type="button"
    [id]="'lifecycle-tab-trash'"
    [attr.aria-selected]="selected() === 'trash'"
    [attr.aria-controls]="'lifecycle-panel'"
    [tabIndex]="selected() === 'trash' ? 0 : -1"
    class="inline-flex h-8 items-center gap-2 rounded-md px-3 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
    [class.bg-background]="selected() === 'trash'"
    [class.text-foreground]="selected() === 'trash'"
    [class.shadow-sm]="selected() === 'trash'"
    [class.text-muted-foreground]="selected() !== 'trash'"
    (click)="select('trash')"
    (keydown)="onKeydown($event, 1)"
  >
    {{ trashLabel() }}
    <span
      class="rounded-full bg-muted px-1.5 text-[11px] font-semibold tabular-nums"
      [class.bg-primary]="selected() === 'trash'"
      [class.text-primary-foreground]="selected() === 'trash'"
    >
      {{ trashCount() ?? '\u2014' }}
    </span>
    @if (trashCountLabel()) {
      <span class="sr-only">{{ trashCountLabel() }}</span>
    }
  </button>
</div>
