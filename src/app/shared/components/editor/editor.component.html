<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div
    class="dialog-surface p-6 w-96">
    <h2 class="font-medium">
      Delete
    </h2>

    <p>
      Are you sure you want
      to delete
      {{ entity()?.slug }}
      ?
    </p>

    <div
      class="flex gap-3 mt-4">
      <button
        (click)="cancel.emit()">
        Cancel
      </button>

      <button
        (click)="confirm.emit()">
        Delete
      </button>
    </div>
  </div>
</div>
