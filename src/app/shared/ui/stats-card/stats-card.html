<div
  class="rounded-xl h-full flex flex-col justify-between border bg-card p-5 transition-colors duration-150"
>
  <div class="flex justify-between items-start">
    <div>
      <p class="text-xs uppercase text-muted-foreground">
        {{ title() }}
      </p>

      <h3 class="mt-3 text-2xl font-medium">
        {{ value() }}
      </h3>

      <p class="mt-2 text-sm text-success">↑ {{ growth() }} vs last week</p>
    </div>

    <div
      class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary ring-1 ring-primary/20"
    >
      <ng-icon [name]="icon()" size="22" class="text-primary" />
    </div>
  </div>

  <div class="mt-4  ">
    <ng-content />
  </div>
</div>
