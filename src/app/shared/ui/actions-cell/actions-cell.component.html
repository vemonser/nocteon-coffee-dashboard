<!--
  Row actions are icon-only: text buttons overflow the column, and an icon set is
  faster to scan in a 40px-tall row. Every button keeps an accessible name and a
  tooltip that opens ABOVE the row so it never covers the controls below it.

  One treatment for all of them — no borders, hover surface only. Soft delete stays
  neutral; red is reserved for permanent delete.
-->
<div class="flex items-center gap-0.5">
  @if (showEdit()) {
    @if (editHref(); as href) {
      <!-- Real anchor: the detail page is this list's single edit surface. -->
      <a
        *hasPermission="editPermission()"
        [routerLink]="href"
        hlmBtn
        variant="ghost"
        size="icon"
        class="text-muted-foreground hover:text-foreground"
        hlmTooltip
        position="top"
        [brnTooltip]="'common.edit' | transloco"
        [attr.aria-label]="'common.edit' | transloco"
      >
        <ng-icon name="lucidePencil" class="size-4" aria-hidden="true" />
      </a>
    } @else {
      <button
        *hasPermission="editPermission()"
        type="button"
        hlmBtn
        variant="ghost"
        size="icon"
        class="text-muted-foreground hover:text-foreground"
        hlmTooltip
        position="top"
        [brnTooltip]="'common.edit' | transloco"
        [attr.aria-label]="'common.edit' | transloco"
        (click)="edit.emit(item())"
      >
        <ng-icon name="lucidePencil" class="size-4" aria-hidden="true" />
      </button>
    }
  }

  @if (showView()) {
    <button
      type="button"
      hlmBtn
      variant="ghost"
      size="icon"
      class="text-muted-foreground hover:text-foreground"
      hlmTooltip
      position="top"
      [brnTooltip]="'common.view' | transloco"
      [attr.aria-label]="'common.view' | transloco"
      (click)="view.emit(item())"
    >
      <ng-icon name="lucideEye" class="size-4" aria-hidden="true" />
    </button>
  }

  @if (showDelete()) {
    <button
      type="button"
      hlmBtn
      variant="ghost"
      size="icon"
      [class]="deleteColorClass()"
      hlmTooltip
      position="top"
      [brnTooltip]="deleteLabel() | transloco"
      [attr.aria-label]="deleteLabel() | transloco"
      (click)="delete.emit(item())"
    >
      <ng-icon name="lucideTrash2" class="size-4" aria-hidden="true" />
    </button>
  }

  @if (showRestore()) {
    <button
      type="button"
      hlmBtn
      variant="secondary"
      size="sm"
      hlmTooltip
      position="top"
      [brnTooltip]="restoreLabel() | transloco"
      [attr.aria-label]="restoreLabel() | transloco"
      (click)="restore.emit(item())"
    >
      {{ restoreLabel() | transloco }}
    </button>
  }

  @if (showPermanentDelete()) {
    <button
      *hasPermission="permanentDeletePermission()"
      type="button"
      hlmBtn
      variant="destructive"
      size="sm"
      hlmTooltip
      position="top"
      [brnTooltip]="permanentDeleteLabel() | transloco"
      [attr.aria-label]="permanentDeleteLabel() | transloco"
      (click)="permanentDelete.emit(item())"
    >
      {{ permanentDeleteLabel() | transloco }}
    </button>
  }
</div>
