<!--
  §4 "Deleted" (Trash tab): the deletion DATE AND TIME, through the shared
  `formatDateTime` ("30 Oct 2026, 7:51 PM"). The relative time ("3 days ago")
  is the tooltip: the column answers "when was it deleted", which needs a
  real timestamp, not a moving duration.
-->
<time
  class="whitespace-nowrap text-xs text-muted-foreground tabular-nums"
  [attr.datetime]="iso()"
  [attr.title]="absolute() ? relative() : ('common.deletionTimeUnavailable' | transloco)"
>
  @if (absolute()) {
    {{ absolute() }}
  } @else {
    {{ 'common.notRecorded' | transloco }}
  }
</time>
