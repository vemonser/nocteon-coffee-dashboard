<div class="flex gap-2 items-center">
  <span
    class="size-2 shrink-0 rounded-full block"
    [class]="value() ? 'bg-success' : 'bg-destructive'"
  ></span>
  <span
    class="text-sm tabular-nums"
    [class]="value() ? 'text-success' : 'text-destructive'"
  >
    {{ value() ? ('common.active' | transloco) : ('common.inactive' | transloco) }}
  </span>
</div>
