<button
  (click)="toggle($event)"
  class="theme-btn hidden items-center justify-center sm:flex"
  [attr.aria-label]="nextThemeLabel() | transloco"
>
  <svg width="24" height="24" viewBox="0 0 44 44" fill="none" aria-hidden="true">
    <!-- Body — sun/moon. Sun uses --primary (brand copper, adapts per theme —
         --accent is a near-bg cream in light mode and would vanish). Moon uses
         --muted-foreground (never off-palette). -->
    <circle
      cx="22"
      cy="22"
      [attr.r]="theme.isDark() ? 12 : 9"
      [attr.fill]="theme.isDark() ? 'var(--muted-foreground)' : 'var(--primary)'"
      style="transition: r 0.4s ease, fill 0.4s ease"
    />

    <!-- Rays — hidden in dark -->
    <g
      [style.opacity]="theme.isDark() ? 0 : 1"
      [style.transition]="'opacity 0.3s ease'"
    >
      <line x1="22" y1="4" x2="22" y2="9" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="35" x2="22" y2="40" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="22" x2="9" y2="22" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="35" y1="22" x2="40" y2="22" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="9" y1="9" x2="13" y2="13" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="31" y1="31" x2="35" y2="35" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="35" y1="9" x2="31" y2="13" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="9" y1="35" x2="13" y2="31" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Mask — slides in to form the crescent -->
    <circle
      [attr.cx]="28"
      cy="16"
      [attr.r]="theme.isDark() ? 8 : 0"
      fill="#000"
      [style.opacity]="theme.isDark() ? 1 : 0"
      style="transition: cx 0.4s ease, r 0.4s ease"
    />
  </svg>
</button>

<!--
  The result of the switch, announced. It stays in the DOM (always the same
  element) and only its TEXT changes, because a live region that is created
  together with its text is not announced by most screen readers — the region
  has to exist first, then be updated.
-->
<span class="sr-only" role="status" aria-live="polite">
  {{ announcementKey() ? (announcementKey() | transloco) : '' }}
</span>
