<!-- tasting-notes-step.component.html -->
<div class="space-y-4">
  <h2 class="text-lg font-medium mb-2">{{ 'products.tastingNotes.title' | transloco }}</h2>
  <p class="text-sm text-muted-foreground mb-4">{{ 'products.tastingNotes.description' | transloco }}</p>

  @if (allNotes().length === 0) {
    <div class="text-center py-12 text-muted-foreground border-2 border-dashed rounded-md">
      {{ 'products.tastingNotes.noNotes' | transloco }}
    </div>
  } @else {
    <div class="flex flex-wrap gap-2">
      @for (note of allNotes(); track note.slug) {
        <button type="button" (click)="toggle(note.slug)"
          class="px-3 py-1.5 rounded-full text-sm border transition-colors"
          [class]="isSelected(note.slug)
            ? 'bg-accent text-accent-foreground border-transparent'
            : 'bg-card text-muted-foreground border-border hover:border-input'">
          {{ getNoteName(note) }}
        </button>
      }
    </div>
  }
</div>
