<header class="flex h-16 shrink-0 items-center rounded-se-md rounded-ss-md gap-2 border-b bg-background px-4">
  <!-- Left -->
  <div class="flex items-center gap-2">
    <!--
    The library's trigger renders a hardcoded English "Toggle Sidebar" as
    its screen-reader text, so BOTH are given the translated label.
-->
<button
  hlmSidebarTrigger
  class="shrink-0"
  [attr.aria-label]="toggleSidebarLabel()"
  [srOnlyText]="toggleSidebarLabel()"
>
      <ng-icon name="lucideMenu" class="size-5" />
    </button>
    <hlm-separator orientation="vertical" class="h-4" />
    <app-breadcrumb />
  </div>

  <!-- Right -->
  <div class="flex items-center gap-2 lg:gap-3 ms-auto">
    <!-- Search trigger -->
    <button
      #searchTrigger
      type="button"
      class="hidden sm:flex h-9 w-64 items-center gap-2 rounded-md border border-input bg-transparent px-3 text-sm text-muted-foreground transition-colors hover:bg-accent"
      (click)="openPalette()"
      [attr.aria-label]="'nav.search' | transloco"
    >
      <ng-icon name="lucideSearch" class="size-4" aria-hidden="true" />
      <span class="flex-1 text-start">{{ 'nav.search' | transloco }}</span>
      <!--
        The shortcut hint is LATIN ("Ctrl K"), so it is a Latin string on
        the Arabic page — the one thing the round-2 rule forbids. The
        Arabic UI keeps the icon and the placeholder (the palette still
        opens with the shortcut); the hint is shown in the LTR layout
        only.
      -->
      @if (language.language() !== 'ar') {
        <kbd class="rounded border bg-muted px-1.5 py-0.5 text-[10px] font-medium">Ctrl K</kbd>
      }
    </button>

    <app-global-search-palette [(open)]="paletteOpen" />

    <app-notification />

    <!-- Quick light/dark toggle. -->
    <app-theme-toggle />

    <app-user-menu variant="navbar" />
  </div>
</header>
