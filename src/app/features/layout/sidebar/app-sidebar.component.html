<div hlmSidebarWrapper>
  <hlm-sidebar  variant="inset" [side]="language.current() === 'ar' ? 'right' : 'left'">
    <!-- Logo -->
    <hlm-sidebar-header>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <a hlmSidebarMenuButton size="lg" routerLink="/dashboard">
            <div
              class="text-sidebar-primary-foreground flex aspect-square size-10 items-center justify-center rounded-md"
            >
              <img src="/logo.svg" alt="nocteon logo icon"  />
            </div>
            <div class="grid flex-1 text-start text-sm leading-tight">
              <span class="truncate font-medium">Nocteon </span>
              <span class="truncate text-xs">Coffee</span>
            </div>
          </a>
        </li>
      </ul>
    </hlm-sidebar-header>

    <!--
      #nav is the scroll container; the component scrolls the active link into view after
      each navigation. Without it, deep sections (Catalog) sat below the fold with no cue.
    -->
    <hlm-sidebar-content #nav>
      <!-- Home -->
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem class="py-1.5">
          <a
            hlmSidebarMenuButton
            [routerLink]="dashboardItem().route"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground [&_ng-icon]:text-sidebar-accent-foreground"
            class="group"
          >
            <ng-icon [name]="dashboardItem().icon" class="size-4 shrink-0 text-sidebar-foreground/60 group-hover:text-sidebar-foreground transition-colors duration-200" />
            <span>{{ dashboardItem().label }}</span>
          </a>
        </li>
      </ul>

      <!-- Sections -->
      @for (section of sections(); track section.key) {
        <!-- A header over a single item is noise — permission filtering can leave one. -->
        @if (section.items.length > 1) {
          <div class="mt-5 px-3 pb-1.5 text-[11px] font-semibold uppercase tracking-wider text-sidebar-foreground/50 first:mt-3">
            {{ section.label }}
          </div>
        }

        <ul hlmSidebarMenu>
          @for (item of section.items; track item.route) {
            <li hlmSidebarMenuItem class="py-1.5">
              <a
                hlmSidebarMenuButton
                [routerLink]="item.route"
                ariaCurrentWhenActive="page"
                routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground [&_ng-icon]:text-sidebar-accent-foreground"
                class="group"
              >
                <ng-icon
                  [name]="item.icon"
                  class="size-4 shrink-0 text-sidebar-foreground/60 group-hover:text-sidebar-foreground transition-colors duration-200"
                />
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      }
    </hlm-sidebar-content>
    <hlm-separator />
    <!-- User Footer -->
    <hlm-sidebar-footer>
      <app-user-menu variant="sidebar" />
    </hlm-sidebar-footer>
  </hlm-sidebar>

  <ng-content />
</div>
