<div hlmSidebarWrapper>
  <hlm-sidebar  variant="inset" [side]="language.current() === 'ar' ? 'right' : 'left'">
    <!-- Logo -->
    <hlm-sidebar-header>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <a hlmSidebarMenuButton size="lg" routerLink="/dashboard">
            <!--
              size-8, not size-10: the menu button is h-12 with p-2, so its
              content box is 32px. A 40px logo was 4px too tall and the
              button's `overflow-hidden` cut the top and the bottom of the
              mark off.
            -->
            <div
              class="text-sidebar-primary-foreground flex aspect-square size-8 items-center justify-center rounded-[var(--radius-control)]"
            >
              <!-- Decorative: the same link already names the brand in text. -->
              <img src="/logo.svg" alt="" />
            </div>
            <div class="grid flex-1 text-start text-sm leading-tight">
              <span class="truncate font-medium">Nocteon</span>
              <span class="truncate text-xs">Coffee</span>
            </div>
          </a>
        </li>
      </ul>
    </hlm-sidebar-header>

    <!--
      #nav is the scroll container; the component scrolls the active link into view after
      each navigation. Without it, deep sections (Catalog) sat below the fold with no cue.
    -->
    <hlm-sidebar-content #nav class="thin-scroll">
      <!-- Home: pinned above the scroll so it never scrolls out of view. -->
      <ul hlmSidebarMenu class="sticky top-0 z-10 bg-sidebar pb-1">
        <li hlmSidebarMenuItem class="py-1.5">
          <a
            hlmSidebarMenuButton
            [routerLink]="dashboardItem().route"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground [&_ng-icon]:text-sidebar-accent-foreground"
            class="group"
          >
            <ng-icon [name]="dashboardItem().icon" class="size-4 shrink-0 text-sidebar-foreground/60 group-hover:text-sidebar-foreground transition-colors duration-150" />
            <span>{{ dashboardItem().label }}</span>
          </a>
        </li>
      </ul>

      <!--
        One <ul> per section. The group labels and their links are real list items —
        they used to be bare <li> elements stacked straight into this flex column,
        which no screen reader announces as a list.
      -->
      @for (section of sections(); track section.key) {
        <ul hlmSidebarMenu class="pt-2 pb-1">
          @for (parentItem of section.items; track parentItem.route) {
            <li hlmSidebarMenuItem class="py-0">
              <!-- Group label: the control that opens and closes the group. It
                   carries the group's icon, so every top-level row starts on the
                   same icon column as the pinned Home row above it. -->
              <button
                type="button"
                (click)="toggleItem(parentItem.route)"
                [attr.aria-expanded]="!isItemCollapsed(parentItem.route)"
                class="flex h-9 w-full cursor-pointer items-center gap-2.5 rounded-[0.625rem] px-2.5 text-start text-[0.8125rem] font-medium text-sidebar-foreground/80 transition-colors duration-150 hover:bg-sidebar-accent/50 hover:text-sidebar-foreground"
              >
                <ng-icon
                  [name]="parentItem.icon"
                  class="size-4 shrink-0 text-sidebar-foreground/60"
                  aria-hidden="true"
                />
                <span class="flex-1 truncate">{{ parentItem.label }}</span>
                <!--
                  Collapsed points at the container's inline start. Written as a
                  direction variant, not a language check, so the arrow follows the
                  layout instead of the translation.
                -->
                <ng-icon
                  name="lucideChevronDown"
                  class="size-3.5 shrink-0 text-sidebar-foreground/50 transition-transform duration-150"
                  [class]="isItemCollapsed(parentItem.route) ? 'ltr:-rotate-90 rtl:rotate-90' : ''"
                />
              </button>

              <!-- Children - collapsible. ps-8, not pl-8: the indent belongs to the
                   inline start, so it lands under the label in Arabic too. The dot
                   replaces the per-page icon: at 6px it costs the same width the
                   old 16px icon did, and it lets the indent read as a hierarchy
                   instead of a second icon column. -->
              <div
                class="nav-collapse"
                [class.nav-collapse-open]="!isItemCollapsed(parentItem.route)"
              >
                <ul hlmSidebarMenu class="min-h-0 overflow-hidden ps-8">
                  @for (child of parentItem.children; track child.route) {
                    <li hlmSidebarMenuItem class="py-0">
                      <a
                        hlmSidebarMenuButton
                        [routerLink]="child.route"
                        ariaCurrentWhenActive="page"
                        routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground [&_span:first-of-type]:bg-sidebar-accent-foreground [&_span:first-of-type]:opacity-100"
                        class="group"
                      >
                        <span
                          class="size-1.5 shrink-0 rounded-full bg-sidebar-foreground/40 transition-colors duration-150 group-hover:bg-sidebar-foreground/70"
                          aria-hidden="true"
                        ></span>
                        <span>{{ child.label }}</span>
                      </a>
                    </li>
                  }
                </ul>
              </div>
            </li>
          }
        </ul>
      }
    </hlm-sidebar-content>
    <hlm-separator />
    <!-- User Footer -->
    <hlm-sidebar-footer>
      <app-user-menu variant="sidebar" />
    </hlm-sidebar-footer>
  </hlm-sidebar>

  <ng-content />
</div>
