<div class="page-shell">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-medium tracking-tight">{{ 'newsletter.title' | transloco }}</h1>
      <p class="text-muted-foreground">
        {{ totalCount() | plural: 'newsletter.totalCount' }}
      </p>
    </div>

    <div class="flex items-center gap-3">
      <!-- The export is what the page is for. -->
      <span hlmTooltip [brnTooltip]="'newsletter.export.hint' | transloco" class="inline-flex">
        <button hlmBtn (click)="exportEmails()" [disabled]="exporting()">
          @if (exporting()) {
            <ng-icon name="lucideLoader2" class="me-2 size-4 animate-spin" />
          } @else {
            <ng-icon name="lucideDownload" class="me-2 size-4" />
          }
          {{ 'newsletter.export.button' | transloco }}
        </button>
      </span>
    </div>
  </div>

  <!-- What the list IS. The API does not carry the per-user newsletter
       flag, so a customer who unsubscribed is still listed. -->
  <p class="flex items-start gap-2 rounded-lg bg-muted/60 px-3 py-2 text-xs text-muted-foreground">
    <ng-icon name="lucideUsers" class="mt-0.5 size-3.5 shrink-0" />
    <span>{{ 'newsletter.audience' | transloco }}</span>
  </p>

  <!-- Search -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
    <div class="relative flex-1 max-w-md">
      <ng-icon
        name="lucideSearch"
        class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-muted-foreground"
      />
      <input
        hlmInput
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        [placeholder]="'newsletter.search' | transloco"
        class="pl-9 w-full"
      />
    </div>
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="rounded-md border">
      <div class="h-12 border-b bg-muted/50 animate-pulse rounded-md" *ngFor="let _ of [1, 2, 3, 4, 5]"></div>
    </div>
  }

  <!-- The table, like every other list -->
  @if (!loading()) {
    <div class="card-surface">
      <app-data-table
        [data]="items()"
        [columns]="columns"
        [loading]="loading()"
        [emptyMessage]="'newsletter.empty' | transloco"
        [showEdit]="false"
        [showDelete]="false"
        [showView]="false"
        (sortChange)="onSortChange($event)"
      />
    </div>
  }

  <!-- Pagination -->
  @if (pageData() && !loading()) {
    <app-pager
      [page]="pageData()!.page"
      [size]="pageData()!.size"
      [totalElements]="pageData()!.totalElements"
      [totalPages]="pageData()!.totalPages"
      [first]="pageData()!.first"
      [last]="pageData()!.last"
      [showPageSize]="true"
      [sizeOptions]="pageSizeOptions"
      (pageChange)="goToPage($event)"
      (sizeChange)="onPageSizeChange($event)"
    />
  }
</div>
