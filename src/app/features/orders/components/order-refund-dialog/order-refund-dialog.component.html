<app-order-dialog
  [open]="open()"
  [title]="title()"
  [description]="unavailableHint()"
  [confirmLabel]="confirmLabel()"
  [cancelLabel]="cancelLabel()"
  [confirmDisabled]="true"
  [pending]="pending()"
  testId="refund-dialog"
  (confirmed)="confirm()"
  (closed)="closed.emit()"
>
  <p
    class="mt-4 rounded-md border border-warning/40 bg-warning-soft px-3 py-2 text-sm text-warning"
    data-testid="refund-unavailable"
  >
    {{ unavailable() }}
  </p>

  <div class="mt-4 space-y-1.5">
    <label for="order-refund-amount" class="text-sm font-medium">{{ amountLabel() }}</label>
    <input
      id="order-refund-amount"
      hlmInput
      type="number"
      disabled
      dir="ltr"
      data-testid="refund-amount"
      [ngModel]="amount()"
      (ngModelChange)="amount.set($event)"
    />
  </div>

  <div class="mt-3 space-y-1.5">
    <label for="order-refund-reason" class="text-sm font-medium">{{ reasonLabel() }}</label>
    <input
      id="order-refund-reason"
      hlmInput
      type="text"
      disabled
      dir="auto"
      data-testid="refund-reason"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
    />
  </div>
</app-order-dialog>
