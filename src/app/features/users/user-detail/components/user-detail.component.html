<div class="page-shell">
  @if (loading()) { <div class="h-64 bg-muted animate-pulse rounded-xl"></div> }
  @if (user(); as u) {
    <header class="flex items-center gap-3">
      <button hlmBtn variant="ghost" size="icon" class="size-9" (click)="goBack()"><ng-icon name="lucideArrowLeft" class="size-4 rtl:rotate-180" /></button>
      <h1 class="text-2xl font-medium">{{ getFullName(u) }}</h1>
      <span class="text-muted-foreground">@{{ u.username }}</span>
      <button hlmBtn variant="outline" size="sm" (click)="openRoleDialog()" [disabled]="isSelf(u)" [attr.aria-disabled]="isSelf(u)">{{ 'users.changeRole' | transloco }}</button>
    </header>
    <section class="card-surface mt-4">
      <div class="px-6 py-4">
        <app-permission-matrix [permissions]="allPermissions" [grantedInput]="u.permissions || []" mode="view" />
      </div>
    </section>
  }
  @if (showRoleDialog() && user(); as u) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
      <div class="dialog-surface w-full max-w-lg p-6 space-y-4">
        <h2 class="text-lg font-medium">{{ 'users.changeRole' | transloco }}</h2>
        <hlm-native-select selectClass="w-full" size="sm" [ngModel]="newRole()" [ngModelOptions]="{standalone:true}" (ngModelChange)="newRole.set($event)">
          @for (role of roleOptions(); track role) { <option [value]="role">{{ 'users.roleNames.' + role | transloco }}</option> }
        </hlm-native-select>
        <div class="flex gap-3">
          <button hlmBtn variant="outline" class="flex-1" (click)="closeRoleDialog()">{{ 'common.cancel' | transloco }}</button>
          <button hlmBtn class="flex-1" [disabled]="newRole() === u.role" (click)="confirmRoleChange()">{{ 'common.saveChanges' | transloco }}</button>
        </div>
      </div>
    </div>
  }
</div>
